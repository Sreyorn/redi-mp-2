<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tasks Management - Orn</title>
    <!-- style -->
    <style>
      .sticky {
        width: 200px;
        background: #fef08a;
        padding: 1rem;
        box-shadow: 4px 4px 8px rgba(0, 0, 0, 0.2);
        transform: rotate(-2deg);
        margin: 2rem;
        font-family: "Inter";
        position: relative;
        /* display: flex; */
      }
      .sticky.pinned {
        order: -1;
      }
      .sticky.pinned::before {
        content: "";
        position: absolute;
        top: -22px;
        left: 50%;
        transform: translateX(-60%) rotate(-20deg);
        width: 16px;
        height: 16px;
        background: radial-gradient(circle at 35% 35%, #ff8080, #c0392b);
        border-radius: 50%;
        box-shadow: 0 3px 6px rgba(0, 0, 0, 0.4);
        z-index: 2;
      }

      .sticky.pinned::after {
        content: "";
        position: absolute;
        top: -14px;
        left: 50%;
        transform: translateX(-50%) rotate(20deg);
        transform-origin: center top;
        width: 8px;
        height: 22px;
        background: linear-gradient(to bottom, #d0d0d0, #888);
        clip-path: polygon(30% 0%, 70% 0%, 50% 100%);
        z-index: 1;
      }
      .note-actions {
        display: flex;
        gap: 0.4rem;
        margin-top: 0.75rem;
        padding-top: 0.5rem;
        border-top: 1px solid rgba(0, 0, 0, 0.1);
      }
      .note-actions button {
        background: none;
        border: none;
        font-size: 0.75rem;
        cursor: pointer;
        padding: 0.2rem 0.5rem;
        border-radius: 4px;
        opacity: 0.55;
        font-family: "Inter";
      }

      .note-actions button:hover {
        opacity: 1;
        background: rgba(0, 0, 0, 0.08);
      }
      .sticky:nth-child(even) {
        transform: rotate(2deg);
      }
      .sticky:nth-child(odd) {
        transform: rotate(-1deg);
      }
      .board {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 2rem;
        padding: 2rem;
        align-items: flex-start;
      }
      .priority-high {
        background: #eb8484;
      }
      .priority-medium {
        background: #beba96;
      }
      .priority-low {
        background: #d1fae5;
      }
      .tag {
        background: rgba(0, 0, 0, 0.1);
        padding: 0.2rem 0.6rem;
        border-radius: 999px;
        font-size: 0.8rem;
      }
      body {
        background: #f5f0e8;
        padding: 2rem;
        font-family: "Inter";
      }
      h1 {
        font-size: 2.5rem;
        margin-bottom: 2rem;
        color: #333;
      }
      .badge {
        padding: 0.2rem 0.7rem;
        border-radius: 999px;
        font-size: 0.8rem;
      }
      .todo {
        background: #83dcd0;
      }
      .done {
        background: #4eae70;
      }
      .in_progress {
        background: #cea16e;
      }
      .addTaskBtn {
        border: #219d4c;
        border-color: #219d4c;
      }
      .page-header {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      h1 {
        flex: 1;
        text-align: center;
      }
      #taskForm {
        background: rgb(246, 203, 88);
        padding: 1.5rem;
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
        gap: 1rem;
        max-width: 400px;
        margin: 1rem 2rem;
      }
      #taskForm label {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
        font-size: 0.9rem;
        font-weight: 600;
        color: #555;
      }
      #taskForm input,
      #taskForm textarea,
      #taskForm select {
        padding: 0.5rem 0.75rem;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-family: "Inter";
        font-size: 0.95rem;
        background: rgb(245, 226, 171);
      }
      #taskForm textarea {
        resize: vertical;
        min-width: 80px;
      }
      #taskForm button[type="submit"] {
        background: #edd190;
        /* color: white; */
        border-color: black;
        padding: 0.6rem 1.7rem;
        border-radius: 8px;
        cursor: pointer;
        align-self: flex-start;
      }
      #taskDialog {
        background: rgb(233, 174, 9);
        border-color: black;
        border-radius: 12px;
        padding: 1.5rem;
        max-width: 420px;
        width: 90%;
      }
      #taskDialog::backdrop {
        background: rgba(0, 0, 0, 0.7);
      }
      #closeBtn {
        position: absolute;
        top: 0.75rem;
        right: 0.75rem;
        background: none;
        border: none;
        font-size: 1.2rem;
        cursor: pointer;
        color: #888;
      }
      #taskForm {
        margin: 0;
      }
      #dialogTitle {
        margin: 1.5rem;
      }

      /* search bar */
      .search-bar {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        padding: 0 2rem 1rem 2rem;
      }
      .search-bar input,
      .search-bar select {
        padding: 0.5rem 0.75rem;
        border: 1px solid #ddd;
        font-size: 0.9rem;
        font-family: "Inter";
        background: white;
      }
      .search-bar input {
        flex: 1; /* takes all remaining space*/
        max-width: 300px;
      }
      .search-bar input:focus {
        outline: none;
        border-color: #e1d259;
        box-shadow: 0 0 0 3px rgba(255, 210, 89, 0.3);
      }

      /* delete dialog */
      #confirmDialog {
        background: rgb(233, 174, 9);
        border-color: black;
        border-radius: 12px;
        padding: 1.5rem;
        max-width: 340px;
        width: 90%;
      }
      #confirmDialog::backdrop {
        background: rgba(0, 0, 0, 0.7);
      }
      #confirmDialog p {
        margin: 0 0 1.25rem 0;
        font-size: 0.95rem;
        color: #444;
        line-height: 1.5;
      }
      #confirmDialog form {
        display: flex;
        gap: 0.6rem;
        justify-content: flex-end;
      }
      #confirmDialog button {
        padding: 0.5rem 1.1rem;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-family: "Inter";
        font-size: 0.9rem;
      }
      /* #confirmDialog button[value="cancel"] {
      } */
      /* #confirmDialog button[value="cancel"]:hover {
      } */
      .cancelBtn {
        background: #eee;
        color: #555;
      }
      .cancelBtn:hover {
        background: #ddd;
      }
      .deleteBtn {
        background: #e63946;
        color: white;
      }
      .deleteBtn:hover {
        background: #c1121f;
      }
    </style>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header class="page-header">
      <h1 style="align-items: center">Your Tasks</h1>
      <button type="button" class="addTaskBtn">+ Add Task</button>
    </header>
    <dialog id="taskDialog">
      <button type="button" id="closeBtn">X</button>
      <h2 id="dialogTitle">New Task</h2>
      <form id="taskForm">
        <label for="title">
          Title
          <input type="text" name="title" required />
        </label>
        <label for="description">
          Description
          <textarea name="description" id="description"></textarea>
        </label>
        <label for="status">
          Status
          <select name="status" id="status">
            <option value="todo">To do</option>
            <option value="in_progress">In Progress</option>
            <option value="done">Done</option>
          </select>
        </label>
        <label for="priority">
          Priority
          <select name="priority" id="priority">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </label>
        <label for="tags">
          Tags(,)
          <input type="text" name="tags" />
        </label>
        <button type="submit">Add</button>
      </form>
    </dialog>
    <dialog id="confirmDialog">
      <p>Delete this task?</p>
      <form method="dialog">
        <button class="cancelBtn" value="cancel">Cancel</button>
        <button class="deleteBtn" value="confirm">Delete</button>
      </form>
    </dialog>
    <!-- search -->
    <div class="search-bar">
      <input
        type="text"
        id="searchInput"
        placeholder="looking for a note? type in!"
      />
      <select name="" id="filterStatus">
        <option value="">All status</option>
        <option value="todo">To do</option>
        <option value="in_progress">In progress</option>
        <option value="done">Done</option>
      </select>
      <select name="" id="filterPriority">
        <option value="">All priority</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
    </div>
    <div class="board">
      {% for task in tasks.values() %}
      <div
        class="sticky {% if task.pinned %}pinned{% endif %}"
        data-task-id="{{ task.id }}"
        data-status="{{task.status}}"
        data-priority="{{task.priority}}"
      >
        <h2>{{task.title}}</h2>
        <p>{{task.description}}</p>
        <span class="badge {{task.status}}">{{task.status}}</span>
        <span class="badge priority-{{task.priority}}"> {{task.priority}}</span>
        <p>
          <strong>Date: </strong> {{task.created_at.strftime("%b %d, %Y") }}
        </p>
        <div class="tags">
          {% for tag in task.tags %}
          <span class="tag">#{{tag}}</span>
          {% endfor %}
        </div>
        <div class="note-actions">
          <button class="btnPin">
            {% if task.pinned %}Unpin{% else %}Pin{% endif %}
          </button>
          <button class="btnEdit">Edit</button>
          <button class="btnDelete">Delete</button>
        </div>
      </div>
      {% endfor %}
    </div>
    <script>
      const btn = document.querySelector(".addTaskBtn");
      const form = document.getElementById("taskForm");
      const dialog = document.getElementById("taskDialog");
      const dialogTitle = document.getElementById("dialogTitle");
      const submitBtn = form.querySelector('button[type="submit"]');
      const confirmDialog = document.getElementById("confirmDialog");

      const searchInput = document.getElementById("searchInput");
      const filterStatus = document.getElementById("filterStatus");
      const filterPriority = document.getElementById("filterPriority");

      let formMode = "create";
      let editingTask = null;
      let pendingDeleteId = null;
      let pendingDeleteNote = null;

      // filter notes - search
      async function filterNote() {
        // server-side
        const params = new URLSearchParams({
          query: searchInput.value,
          status: filterStatus.value,
          priority: filterPriority.value,
        });
        const res = await fetch(`/tasks/?${params}`);
        const tasks = await res.json();
        renderBoard(tasks);

        // client-side
        // const query = searchInput.value.toLowerCase();
        // const statusFilter = filterStatus.value;
        // const priorityFilter = filterPriority.value;

        // document.querySelectorAll(".sticky").forEach((note) => {
        //   const matchesText = note.textContent.toLowerCase().includes(query);
        //   const matchesStatus =
        //     !statusFilter || note.dataset.status === statusFilter;
        //   const matchesPriority =
        //     !priorityFilter || note.dataset.priority === priorityFilter;

        //   note.style.display =
        //     matchesText && matchesStatus && matchesPriority ? "" : "none";
        //   // <option value="high">High</option>
        // });
      }

      function renderBoard(tasks) {
        const board = document.querySelector(".board");
        board.innerHTML = Object.values(tasks)
          .map(
            (task) => `
           <div class="sticky ${task.pinned ? "pinned" : ""}"
           data-task-id="${task.id}"
           data-status="${task.status}"
           data-priority="${task.priority}">
        <h2>${task.title}</h2>
        <p>${task.description}</p>
        <span class="badge ${task.status}">${task.status}</span>
        <span class="badge priority-${task.priority}">${task.priority}</span>
         <div class="tags">
        ${task.tags.map((t) => `<span class="tag">#${t}</span>`).join("")}
        </div>
        <div class="note-actions">
          <button class="btnPin">${task.pinned ? "Unpin" : "Pin"}</button>
          <button class="btnEdit">Edit</button>
          <button class="btnDelete">Delete</button>
        </div>
      </div>
        `,
          )
          .join("");
      }

      searchInput.addEventListener("input", filterNote);
      filterStatus.addEventListener("change", filterNote);
      filterPriority.addEventListener("change", filterNote);

      confirmDialog.addEventListener("close", async () => {
        if (confirmDialog.returnValue === "confirm") {
          await fetch(`/task/${pendingDeleteId}`, { method: "DELETE" });
          pendingDeleteNote.remove();
        }
      });

      btn.addEventListener("click", () => {
        // form.hidden = !form.hidden;
        formMode = "create";
        editingTask = null;
        dialogTitle.textContent = "New Task";
        submitBtn.textContent = "Add";
        form.reset();
        dialog.showModal();
      });
      // close button
      document
        .getElementById("closeBtn")
        .addEventListener("click", () => dialog.close());

      // event delegation — one listener handles all three buttons
      document.querySelector(".board").addEventListener("click", async (e) => {
        const note = e.target.closest(".sticky");
        if (!note) return;
        const taskId = note.dataset.taskId;

        if (e.target.matches(".btnDelete")) {
          // await fetch(`/task/${taskId}`, { method: "DELETE" });
          // note.remove();
          pendingDeleteId = taskId;
          pendingDeleteNote = note;
          confirmDialog.showModal();
        }

        if (e.target.matches(".btnEdit")) {
          const res = await fetch(`/task/${taskId}`);
          editingTask = await res.json();

          form.title.value = editingTask.title;
          form.description.value = editingTask.description;
          form.status.value = editingTask.status;
          form.priority.value = editingTask.priority;
          form.tags.value = editingTask.tags.join(", ");

          formMode = "edit";
          dialogTitle.textContent = "Edit Task";
          submitBtn.textContent = "Save";
          dialog.showModal();
        }

        if (e.target.matches(".btnPin")) {
          const res = await fetch(`/task/${taskId}`);
          const task = await res.json();
          const updated = { ...task, pinned: !task.pinned };

          await fetch(`/task/${taskId}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(updated),
          });

          note.classList.toggle("pinned");
          e.target.textContent = updated.pinned ? "Unpin" : "Pin";
        }
      });

      // submit — handles both create and edit
      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const formData = {
          title: form.title.value,
          description: form.description.value,
          status: form.status.value,
          priority: form.priority.value,
          tags: form.tags.value
            .split(",")
            .map((t) => t.trim())
            .filter((t) => t),
        };

        if (formMode === "create") {
          const taskId = Date.now();
          await fetch(`/task/${taskId}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(formData),
          });
        } else {
          const updatedTask = { ...editingTask, ...formData };
          await fetch(`/task/${editingTask.id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(updatedTask),
          });
        }

        dialog.close();
        form.reset();
        window.location.reload();
      });
    </script>
  </body>
</html>
