<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tasks Management - Orn</title>
    <!-- style -->
    <style>
      .sticky {
        width: 200px;
        background: #fef08a;
        padding: 1rem;
        box-shadow: 4px 4px 8px rgba(0, 0, 0, 0.2);
        transform: rotate(-2deg);
        margin: 2rem;
        font-family: "Inter";
        /* display: flex; */
      }
      .sticky:nth-child(even) {
        transform: rotate(2deg);
      }
      .sticky:nth-child(odd) {
        transform: rotate(-1deg);
      }
      .board {
        display: flex;
        flex-wrap: wrap;
        gap: 2rem;
        padding: 2rem;
        align-items: flex-start;
      }
      .priority-high {
        background: #fecaca;
      }
      .priority-medium {
        background: #fef08a;
      }
      .priority-low {
        background: #d1fae5;
      }
      .tag {
        background: rgba(0, 0, 0, 0.1);
        padding: 0.2rem 0.6rem;
        border-radius: 999px;
        font-size: 0.8rem;
      }
      body {
        background: #f5f0e8;
        padding: 2rem;
        font-family: "Inter";
      }
      h1 {
        font-size: 2.5rem;
        margin-bottom: 2rem;
        color: #333;
      }
      .badge {
        padding: 0.2rem 0.7rem;
        border-radius: 999px;
        font-size: 0.8rem;
      }
      .todo {
        background: #c7d2fe;
      }
      .done {
        background: #bbf7d0;
      }
      .in_progress {
        background: #fed7aa;
      }
      .btnAddTask {
        border: #219d4c;
        border-color: #219d4c;
      }
      .page-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      #taskForm {
        background: white;
        padding: 1.5rem;
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
        gap: 1rem;
        max-width: 400px;
        margin: 1rem 2rem;
      }
      #taskForm label {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
        font-size: 0.9rem;
        font-weight: 600;
        color: #555;
      }
      #taskForm input,
      #taskForm textarea,
      #taskForm select {
        padding: 0.5rem 0.75rem;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-family: "Inter";
        font-size: 0.95rem;
      }
      #taskForm textarea {
        resize: vertical;
        min-width: 80px;
      }
      #taskForm button[type="submit"] {
        background: #e1d259;
        /* color: white; */
        border: none;
        padding: 0.6rem 1.2rem;
        border-radius: 8px;
        cursor: pointer;
        align-self: flex-start;
      }
      #taskDialog {
        border: none;
        border-radius: 2px;
        padding: 0;
        max-width: 420px;
        width: 90%;
      }
      #taskDialog::backdrop {
        background: rgba(0, 0, 0, 0.4);
      }
      #closeBtn {
        position: absolute;
        top: 0.75rem;
        right: 0.75rem;
        background: none;
        border: none;
        font-size: 1.2rem;
        cursor: pointer;
        color: #888;
      }
      #taskForm {
        margin: 0;
      }
    </style>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header class="page-header">
      <h1 style="align-items: center">Your Tasks</h1>
      <button type="button" class="btnAddTask">+ Add Task</button>
    </header>
    <dialog id="taskDialog">
      <button type="button" id="closeBtn">X</button>
      <form id="taskForm">
        <label for="title">
          Title
          <input type="text" name="title" required />
        </label>
        <label for="description">
          Description
          <textarea name="description" id="description"></textarea>
        </label>
        <label for="status">
          Status
          <select name="status" id="status">
            <option value="todo">To do</option>
            <option value="in_progress">In Progress</option>
            <option value="done">Done</option>
          </select>
        </label>
        <label for="priority">
          Priority
          <select name="priority" id="priority">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </label>
        <label for="tags">
          Tags(,)
          <input type="text" name="tags" />
        </label>
        <button type="submit">Add</button>
      </form>
    </dialog>
    <div class="board">
      {% for task in tasks.values() %}
      <div class="sticky">
        <h2>{{task.title}}</h2>
        <p>{{task.description}}</p>
        <!-- <p><strong>Status: </strong> {{task.status}}</p> -->
        <span class="badge {{task.status}}">{{task.status}}</span>
        <span class="badge priority-{{task.priority}}"> {{task.priority}}</span>
        <p>
          <strong>Date: </strong> {{task.created_at.strftime("%b %d, %Y") }}
        </p>
        <div class="tags">
          {% for tag in task.tags %}
          <span class="tag">#{{tag}}</span>
          {% endfor %}
        </div>
      </div>
      {% endfor %}
    </div>
    <script>
      const btn = document.querySelector(".btnAddTask");
      const form = document.getElementById("taskForm");
      const dialog = document.getElementById("taskDialog");

      btn.addEventListener("click", () => {
        // form.hidden = !form.hidden;
        dialog.showModal();
      });
      document
        .getElementById("closeBtn")
        .addEventListener("click", () => dialog.close());
      form.addEventListener("submit", async (e) => {
        // prevent browswer's default page reload on submit
        e.preventDefault();

        // read the form into an obj matching the task model
        const task = {
          title: form.title.value,
          description: form.description.value,
          status: form.status.value,
          priority: form.priority.value,
          tags: form.tags.value
            .split(",")
            .map((t) => t.trim())
            .filter((t) => t),
        };

        // pick an id
        const taskId = Date.now();

        // send to FastAPI
        const res = await fetch(`/task/${taskId}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(task),
        });
        const newTask = await res.json();

        // hide form and reset it
        // form.hidden = true;
        dialog.close();
        form.reset();

        // reload the page to show new task
        window.location.reload();
      });
    </script>
  </body>
</html>
